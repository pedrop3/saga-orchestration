<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saga Flow — Without AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #080f1c;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 24px 64px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(99,102,241,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(16,185,129,.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .page-title {
      font-size: 11px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: #6366f1; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .page-title::before, .page-title::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,.4), transparent);
      min-width: 80px;
    }

    .page-subtitle {
      font-size: 22px; font-weight: 800;
      color: #fff; text-align: center; margin-bottom: 6px;
      letter-spacing: -.02em;
    }
    .page-subtitle span {
      background: linear-gradient(110deg, #a5b4fc, #06b6d4);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-desc {
      font-size: 13px; color: #475569;
      text-align: center; margin-bottom: 40px;
    }

    svg { display: block; overflow: visible; }
  </style>
</head>
