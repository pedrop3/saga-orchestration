server:
  port: 8099

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: ai-agent-group
      auto-offset-reset: latest
    topic:
      notify-ending: notify-ending

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  #data:
  #  redis:
  #    host: ${REDIS_HOST:localhost}
  #    port: 6379

ai:
  primary-model: gemini
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${OLLAMA_MODEL:qwen3:8b}
    timeout: 120

  gemini:
    api-key: ${GEMINI_API_KEY}
    model-name: ${GEMINI_MODEL:gemini-2.5-flash}

  claude:
    api-key: ${CLAUDE_API_KEY}
    model-name: ${CLAUDE_MODEL:claude-sonnet-4-20250514}

mcp:
  order-service-url:      ${ORDER_MCP_URL:http://localhost:3000/sse}
  payment-service-url:    ${PAYMENT_MCP_URL:http://localhost:8091/sse}
  inventory-service-url:  ${INVENTORY_MCP_URL:http://localhost:8092/sse}
  product-validation-url: ${PRODUCT_VALIDATION_MCP_URL:http://localhost:8090/sse}
  orchestrator-url:       ${ORCHESTRATOR_MCP_URL:http://localhost:8050/sse}