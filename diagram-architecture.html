<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architecture Diagram — AI Agent + MCP + Saga</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #080f1c;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 20% 15%, rgba(99,102,241,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 80% 85%, rgba(139,92,246,.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .page-title {
      font-size: 13px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      color: #6366f1; margin-bottom: 36px;
      display: flex; align-items: center; gap: 10px;
    }
    .page-title::before, .page-title::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,.4), transparent);
      min-width: 60px;
    }

    /* ── Canvas ── */
    .canvas {
      position: relative;
      width: 1100px;
    }

    /* ── Section labels ── */
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: #475569;
      margin-bottom: 12px; padding-left: 4px;
    }

    /* ── Row layout ── */
    .row {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-bottom: 0;
    }

    /* ── Swimlane columns ── */
    .lane {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* ── Nodes ── */
    .node {
      position: relative;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(6px);
    }

    .node-icon { font-size: 22px; line-height: 1; }
    .node-name { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .node-sub  { font-size: 11px; color: #64748b; line-height: 1.4; }
    .node-tag  {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; font-weight: 500;
      padding: 2px 7px; border-radius: 5px;
      margin-top: 2px;
    }

    /* colour variants */
    .node-user     { border-color: rgba(100,116,139,.3); }
    .node-agent    { border-color: rgba(99,102,241,.35); background: rgba(99,102,241,.06); }
    .node-agent .node-tag { background: rgba(99,102,241,.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,.25); }

    .node-mcp      { border-color: rgba(6,182,212,.3); background: rgba(6,182,212,.05); }
    .node-mcp .node-tag { background: rgba(6,182,212,.12); color: #22d3ee; border: 1px solid rgba(6,182,212,.2); }

    .node-service  { border-color: rgba(16,185,129,.25); background: rgba(16,185,129,.04); }
    .node-service .node-tag { background: rgba(16,185,129,.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,.2); }

    .node-infra    { border-color: rgba(245,158,11,.2); background: rgba(245,158,11,.04); }
    .node-infra .node-tag { background: rgba(245,158,11,.1); color: #fcd34d; border: 1px solid rgba(245,158,11,.18); }

    .node-llm      { border-color: rgba(139,92,246,.35); background: rgba(139,92,246,.07); }
    .node-llm .node-tag { background: rgba(139,92,246,.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,.25); }

    /* ── SVG diagram ── */
    .diagram-svg {
      width: 1100px;
      display: block;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 24px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: flex; align-items: center; gap: 7px;
      font-size: 11px; color: #64748b;
    }

    .legend-line {
      width: 28px; height: 2px; border-radius: 2px; flex-shrink: 0;
    }
    .leg-user    { background: #94a3b8; }
    .leg-tool    { background: #6366f1; }
    .leg-mcp     { background: #06b6d4; }
    .leg-kafka   { background: #f59e0b; }
    .leg-redis   { background: #10b981; }
    .leg-llm     { background: #8b5cf6; stroke-dasharray: 5,3; }

    .legend-dash {
      width: 28px; height: 0; flex-shrink: 0;
      border-top: 2px dashed #8b5cf6;
    }
  </style>
</head>
